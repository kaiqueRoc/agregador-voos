name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aggregator
    # Postgres de verdade para o teste de integração da persistência.
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: aggregator
          POSTGRES_PASSWORD: aggregator
          POSTGRES_DB: aggregator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aggregator" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aggregator:aggregator@localhost:5432/aggregator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aggregator/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run cov
      - run: npm run build

  e2e:
    name: Smoke test com docker compose
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack (providers + redis + agregador)
        run: docker compose up -d --build --wait
      - name: Busca real contra os mocks
        run: |
          body=$(curl -sf -X POST localhost:8000/search \
            -H 'Content-Type: application/json' \
            -d '{"origin":"GRU","destination":"GIG","date":"2026-10-20"}')
          echo "$body" | jq '.meta'
          test "$(echo "$body" | jq '.meta.total')" -eq 60
          test "$(echo "$body" | jq '.meta.partial')" = "false"
      - name: Busca foi persistida no Postgres
        run: |
          sleep 1
          docker compose exec -T postgres psql -U aggregator -d aggregator -tAc             "SELECT count(*) FROM search_flights" | grep -qE '^[1-9][0-9]*$'
      - name: Segunda busca vem do cache
        run: |
          curl -sf -X POST localhost:8000/search \
            -H 'Content-Type: application/json' \
            -d '{"origin":"GRU","destination":"GIG","date":"2026-10-20"}' \
            | jq -e '[.meta.providers[].cached] | all'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
