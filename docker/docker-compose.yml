name: agregador-voos

# Rede usada no build das imagens: `default` (bridge do Docker) por padrão.
# Em host com systemd-resolved ou resolver de VPN, o build não resolve DNS pela
# bridge: rode com `BUILD_NETWORK=host docker compose up --build`.
# Não é `host` por padrão porque o Compose recente (buildx bake) exige permissão
# extra para isso e o build falha em CI e em servidores com Docker atualizado.

services:
  # ---------------------------------------------------------------- providers
  # Sistemas de terceiros simulados. Mesma imagem, contratos diferentes.
  provider-a:
    build:
      context: ../mocks
      network: ${BUILD_NETWORK:-default}
    image: agregador-voos-mocks
    environment:
      PROVIDER: a
    ports:
      - "3001:3000"

  provider-b:
    build:
      context: ../mocks
      network: ${BUILD_NETWORK:-default}
    image: agregador-voos-mocks
    environment:
      PROVIDER: b
    ports:
      - "3002:3000"

  provider-c:
    build:
      context: ../mocks
      network: ${BUILD_NETWORK:-default}
    image: agregador-voos-mocks
    environment:
      PROVIDER: c
      # Chaos engineering: `make chaos` liga, `make calm` volta ao normal.
      FAIL_RATE: ${FAIL_RATE:-0}        # 0.3 = 30% das chamadas devolvem 500
      TIMEOUT_RATE: ${TIMEOUT_RATE:-0}  # 0.3 = 30% estouram o timeout de 3s
    ports:
      - "3003:3000"

  # ------------------------------------------------------------------- cache
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  # ------------------------------------------------- analytics (bônus: BD)
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aggregator}
      POSTGRES_DB: aggregator
    ports:
      - "5433:5432"   # 5433 no host: evita conflito com Postgres local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d aggregator"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------- agregador
  aggregator:
    build:
      context: ../aggregator
      dockerfile: ../docker/Dockerfile
      network: ${BUILD_NETWORK:-default}
    image: agregador-voos-aggregator
    environment:
      PROVIDER_A_URL: http://provider-a:3000/provider-a/search
      PROVIDER_B_URL: http://provider-b:3000/provider-b/search
      PROVIDER_C_URL: http://provider-c:3000/provider-c/search
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: "300"
      PROVIDER_TIMEOUT_MS: "3000"
      SELECTION_STRATEGY: balanced   # cheapest | max_commission | balanced
      PRICE_TOLERANCE_BPS: "200"     # 2%
      PRICE_TOLERANCE_MAX_CENTS: "3000"  # R$ 30,00
      PERSISTENCE_ENABLED: "true"
      DATABASE_URL: postgres://aggregator:${POSTGRES_PASSWORD:-aggregator}@postgres:5432/aggregator
      LOG_LEVEL: info
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      provider-a:
        condition: service_started
      provider-b:
        condition: service_started
      provider-c:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------- observabilidade (opcional)
  # make observability   (= OTEL_ENABLED=true docker compose --profile observability up)
  #   Grafana (dashboard + logs): http://localhost:3000
  #   Jaeger (traces):       http://localhost:16686
  #   Prometheus (métricas): http://localhost:9090
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [observability]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Logs: Alloy lê o stdout dos containers (via Docker) e envia para o Loki.
  loki:
    image: grafana/loki:3.3.2
    profiles: [observability]
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: [observability]
    command: run /etc/alloy/config.alloy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Leitura anônima: o dashboard abre direto, sem login (só visualização).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aggregator.json
      # `make public` desliga TODO login (formulário E basic auth na API):
      # exposto na internet, ninguém consegue entrar como admin.
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN:-false}
      GF_AUTH_BASIC_ENABLED: ${GRAFANA_BASIC_AUTH:-true}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aggregator}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - postgres
      - loki

  # ------------------------------------------- acesso público (opcional)
  # make public: Cloudflare Quick Tunnel — URL https pública, sem conta, sem
  # domínio e sem abrir porta no roteador (a conexão SAI daqui para a
  # Cloudflare). A URL muda a cada restart do tunnel: `make public-url`.
  tunnel-api:
    image: cloudflare/cloudflared:2024.12.2
    profiles: [public]
    command: tunnel --no-autoupdate --url http://aggregator:8000
    depends_on:
      aggregator:
        condition: service_healthy
    restart: unless-stopped

  tunnel-dashboard:
    image: cloudflare/cloudflared:2024.12.2
    profiles: [public]
    command: tunnel --no-autoupdate --url http://grafana:3000
    depends_on:
      - grafana
    restart: unless-stopped

volumes:
  postgres-data:
